<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="same-origin">
  <meta name="color-scheme" content="light dark">
  <title>顶级 UI 提示词包 · 输入访问码</title>
  <style>
    :root{--bg:#f6f5f3;--card:#ffffff;--ink:#17201b;--muted:#5f6b64;--line:#dde2dc;--accent:#15663b;--on-accent:#fff;--error:#a33131}
    @media(prefers-color-scheme:dark){:root{--bg:#121714;--card:#1a211d;--ink:#e9eee9;--muted:#a3b0a8;--line:#2e3833;--accent:#5cc48a;--on-accent:#0c1410;--error:#ffb4ab}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;line-height:1.7}
    main{min-height:100svh;display:grid;place-items:center;padding:32px 16px}
    .card{width:min(100%,440px);padding:36px;border:1px solid var(--line);border-radius:20px;background:var(--card)}
    .logo{display:block;width:56px;height:56px}
    .eyebrow{font-size:13px;letter-spacing:.06em;color:var(--muted);margin-top:20px}
    h1{font-size:28px;font-weight:600;line-height:1.35;margin:8px 0 12px;text-wrap:balance}
    p{margin:12px 0}.intro,.foot{color:var(--muted);font-size:14px}
    form{margin-top:24px}
    label[for=access-code]{display:block;font-weight:600;margin-bottom:8px}
    .input-row{display:flex;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
    .input-row:focus-within{outline:2px solid var(--accent);outline-offset:2px}
    input[type=password],input[type=text]{flex:1;min-width:0;width:100%;font:inherit;font-size:16px;padding:13px 14px;background:transparent;color:var(--ink);border:0;outline:none}
    button{font:inherit;cursor:pointer}
    #show-code{border:0;background:transparent;color:var(--accent);padding:10px 14px;white-space:nowrap}
    .remember{display:flex;gap:8px;align-items:center;font-size:14px;margin:16px 0}
    input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
    #enter{width:100%;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);padding:13px;font-weight:600}
    button:disabled{opacity:.65;cursor:wait}
    button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
    #access-error{color:var(--error);font-size:14px;min-height:24px;margin-bottom:8px}
    .foot{margin:22px 0 0}[hidden]{display:none!important}.loading{color:var(--muted);font-size:14px}
    @media(max-width:420px){.card{padding:28px 22px}h1{font-size:25px}}
  </style>
</head>
